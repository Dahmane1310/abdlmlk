packages:
  - apps/*
  - packages/*

allowBuilds:
  '@swc/core': true
  better-sqlite3: true
  core-js-pure: false
  esbuild: true
  lightningcss: true

# One version of React's type definitions for the whole workspace. Strapi pulls
# in React 18 types; pnpm hoisted them where TanStack Router (which doesn't
# declare its React types) found them, so the site was type-checked against
# React 18. Types only: Strapi ships prebuilt and runs on its own React 18.
# (A packageExtensions peer was tried first: it split TanStack Router into two
# copies at runtime and broke every <Link>.)
overrides:
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
