# Builds the website's image on GitHub's machines, then has Dokploy deploy it,
# like the CMS (cms.yml): the VPS only pulls and runs finished images.
name: Website

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .dockerignore
      - .github/workflows/web.yml
  # Also runnable by hand, from the repository's Actions tab.
  workflow_dispatch:

# A newer push replaces a build still running: only the latest is deployed.
concurrency:
  group: web
  cancel-in-progress: true

permissions:
  contents: read
  # To push the image to GitHub's container registry.
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry names must be lowercase, hence the owner spelled out.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          # Baked into the browser bundle: the CMS's public address.
          build-args: VITE_STRAPI_URL=https://cms.abdlmlk.com
          tags: |
            ghcr.io/dahmane1310/abdlmlk-web:latest
            ghcr.io/dahmane1310/abdlmlk-web:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Dokploy pulls ":latest" and restarts the site.
      - name: Deploy on Dokploy
        run: curl --fail --silent --show-error --request POST "${{ secrets.DOKPLOY_WEB_WEBHOOK }}"
