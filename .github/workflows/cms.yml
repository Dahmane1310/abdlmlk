# Builds the CMS's image on GitHub's machines, then has Dokploy deploy it. The
# VPS (3.7 GB, shared with other apps) runs out of memory building Strapi's
# admin panel, so it only pulls and runs the finished image.
name: CMS

on:
  push:
    branches: [main]
    paths:
      - apps/cms/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .dockerignore
      - .github/workflows/cms.yml
  # Also runnable by hand, from the repository's Actions tab.
  workflow_dispatch:

# A newer push replaces a build still running: only the latest is deployed.
concurrency:
  group: cms
  cancel-in-progress: true

permissions:
  contents: read
  # To push the image to GitHub's container registry.
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry names must be lowercase, hence the owner spelled out.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/cms/Dockerfile
          push: true
          tags: |
            ghcr.io/dahmane1310/abdlmlk-cms:latest
            ghcr.io/dahmane1310/abdlmlk-cms:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=cms
          cache-to: type=gha,mode=max,scope=cms

      # Dokploy pulls ":latest" and restarts the CMS.
      - name: Deploy on Dokploy
        run: curl --fail --silent --show-error --request POST "${{ secrets.DOKPLOY_CMS_WEBHOOK }}"
